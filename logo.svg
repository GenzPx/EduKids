<?xml version="1.0" encoding="UTF-8"?>
<!--
  EduKids — Teman Belajar Si Kecil
  File: logo.svg
  Version: 1.0.0
  Author: GenzPx / artaDev / Xternalz
  Description: App logo — Dacorta the Panda with book and pencil
  License: MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB380"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFE8D6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#FF8C42" stroke-width="4"/>

  <!-- Book base -->
  <rect x="128" y="340" width="256" height="80" rx="16" fill="url(#bookGrad)"/>
  <rect x="136" y="348" width="118" height="64" rx="8" fill="#FFB380"/>
  <rect x="262" y="348" width="114" height="64" rx="8" fill="#FFCCA0"/>
  <line x1="256" y1="348" x2="256" y2="412" stroke="#E07030" stroke-width="4"/>
  <!-- Book lines -->
  <line x1="152" y1="368" x2="232" y2="368" stroke="#E07030" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="152" y1="384" x2="216" y2="384" stroke="#E07030" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="152" y1="400" x2="200" y2="400" stroke="#E07030" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <line x1="278" y1="368" x2="358" y2="368" stroke="#E07030" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="278" y1="384" x2="342" y2="384" stroke="#E07030" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="256" cy="320" rx="110" ry="85" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
  <ellipse cx="256" cy="315" rx="65" ry="50" fill="#F5F5F5"/>

  <!-- Left arm -->
  <ellipse cx="155" cy="300" rx="40" ry="28" fill="#2D2D2D" transform="rotate(-20 155 300)"/>
  <!-- Right arm -->
  <ellipse cx="357" cy="300" rx="40" ry="28" fill="#2D2D2D" transform="rotate(20 357 300)"/>

  <!-- Left foot -->
  <ellipse cx="210" cy="395" rx="35" ry="24" fill="#2D2D2D"/>
  <!-- Right foot -->
  <ellipse cx="302" cy="395" rx="35" ry="24" fill="#2D2D2D"/>

  <!-- Head -->
  <circle cx="256" cy="185" r="105" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>

  <!-- Left ear -->
  <circle cx="172" cy="100" r="40" fill="#2D2D2D"/>
  <circle cx="172" cy="100" r="22" fill="#E0E0E0"/>
  <!-- Right ear -->
  <circle cx="340" cy="100" r="40" fill="#2D2D2D"/>
  <circle cx="340" cy="100" r="22" fill="#E0E0E0"/>

  <!-- Eye patches -->
  <ellipse cx="218" cy="178" rx="38" ry="34" fill="#2D2D2D" transform="rotate(-5 218 178)"/>
  <ellipse cx="294" cy="178" rx="38" ry="34" fill="#2D2D2D" transform="rotate(5 294 178)"/>

  <!-- Eyes (happy sparkle) -->
  <circle cx="218" cy="174" r="15" fill="#FFFFFF"/>
  <circle cx="222" cy="170" r="7" fill="#FFFFFF"/>
  <circle cx="294" cy="174" r="15" fill="#FFFFFF"/>
  <circle cx="298" cy="170" r="7" fill="#FFFFFF"/>

  <!-- Nose -->
  <ellipse cx="256" cy="210" rx="14" ry="10" fill="#2D2D2D"/>

  <!-- Mouth (happy) -->
  <path d="M232 225 Q256 255 280 225" fill="none" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <circle cx="185" cy="215" r="16" fill="#FFB3B3" opacity="0.5"/>
  <circle cx="327" cy="215" r="16" fill="#FFB3B3" opacity="0.5"/>

  <!-- Pencil in right hand -->
  <g transform="translate(365, 240) rotate(25)">
    <rect x="0" y="0" width="18" height="75" rx="3" fill="#FFD54F"/>
    <rect x="0" y="0" width="18" height="14" rx="3" fill="#F44336"/>
    <polygon points="0,75 9,92 18,75" fill="#FFB74D"/>
    <polygon points="4,87 9,95 14,87" fill="#424242"/>
    <!-- Metal band -->
    <rect x="0" y="12" width="18" height="4" rx="1" fill="#C0C0C0"/>
    <!-- Eraser -->
    <rect x="2" y="2" width="14" height="8" rx="2" fill="#FF8A80"/>
  </g>

  <!-- Sparkle decorations -->
  <g fill="#FFD700" opacity="0.8">
    <polygon points="130,65 134,55 138,65 128,59 142,59" />
    <polygon points="380,55 384,45 388,55 378,49 392,49" />
    <polygon points="100,175 103,168 106,175 98,171 108,171" />
    <polygon points="410,170 413,163 416,170 408,166 418,166" />
  </g>

  <!-- "EduKids" text arc (optional — can be shown separately) -->
  <!-- Not included as text to avoid font dependency issues -->
</svg>
